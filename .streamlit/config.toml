[server]
# Max upload size for a single file, in MB. Default is 200; face photos
# don't need that much, and a smaller cap avoids someone accidentally
# uploading something huge on a low-memory free-tier deploy.
maxUploadSize = 15

[theme]
base = "dark"
primaryColor = "#6366F1"
backgroundColor = "#0B0F19"
secondaryBackgroundColor = "#151B2B"
textColor = "#E5E7EB"
font = "sans serif"
